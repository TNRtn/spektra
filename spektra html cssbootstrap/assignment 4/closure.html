<!DOCTYPE html>
<html>
    <head>
        <title>closure</title>
    </head>
    <body>
        <label for="num1">Enter num1 :</label>
        <input type="number" placeholder="Enter num1:" id="num1"><br />
        <label for="num2">Enter num2 :</label>
        <input type="number" placeholder="Enter num2:" id="num2">
        <button type="submit" onclick="closure()">submit</button>
        <div id="closure"></div>
    </body>
    <script>
        function closure(){
            let a=parseInt(document.getElementById("num1").value);
            let b=parseInt(document.getElementById("num2").value);
            let c=outerfunction(a)(b);
            s="<p><strong>SUM :</strong>"+`${c}`+"</p>";
            document.getElementById("closure").innerHTML=s;
        }
        function outerfunction(x){
                return function innerfunction(y){
                    return x+y;
                }
            }
    </script>
</html>
