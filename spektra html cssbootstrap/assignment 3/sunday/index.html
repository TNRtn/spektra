<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>January 1st Sundays</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0-alpha3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">
    <div class="container py-5">
        <h1 class="text-center mb-4">Years when January 1st is a Sunday</h1>
        <div class="row justify-content-center">
            <div class="col-md-6">
                <div class="mb-3">
                    <label for="startYear" class="form-label">Start Year:</label>
                    <input type="number" class="form-control" id="startYear" />
                </div>
                <div class="mb-3">
                    <label for="endYear" class="form-label">End Year:</label>
                    <input type="number" class="form-control" id="endYear" />
                </div>
                <button class="btn btn-primary w-100 mb-3" onclick="Submit()">Find Sundays</button>
                <p id="error-message" class="text-danger text-center"></p>
                <ul id="sundays-list" class="list-group"></ul>
            </div>
        </div>
    </div>

    <script>
        function findSundays(startYear, endYear) {
            let s = "";
            for (let year = startYear; year <= endYear; year++) {
                let date = new Date(year, 0, 1);
                if (date.getDay() === 0) {
                    s += `<li class="list-group-item">1st January is a Sunday in ${year}</li>`;
                }
            }
            document.getElementById("sundays-list").innerHTML = s;
        }

        function Submit() {
            const startYear = parseInt(document.getElementById('startYear').value);
            const endYear = parseInt(document.getElementById('endYear').value);
            const errorMessage = document.getElementById('error-message');

            if (isNaN(startYear) || isNaN(endYear)) {
                errorMessage.textContent = 'Please enter valid numbers for both years.';
                return;
            }

            if (endYear < startYear) {
                errorMessage.textContent = 'End year must be greater than or equal to start year.';
                return;
            }

            errorMessage.textContent = '';
            findSundays(startYear, endYear);
        }
    </script>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0-alpha3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
