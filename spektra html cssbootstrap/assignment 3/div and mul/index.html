<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Multiplication and Division</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0-alpha3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">
    <div class="container py-5">
        <h1 class="text-center mb-4">Multiplication and Division of Two Numbers</h1>
        <div class="row justify-content-center">
            <div class="col-md-6">
                <div class="mb-3">
                    <label for="num1" class="form-label">Number 1:</label>
                    <input type="number" class="form-control" id="num1" />
                </div>
                <div class="mb-3">
                    <label for="num2" class="form-label">Number 2:</label>
                    <input type="number" class="form-control" id="num2" />
                </div>
                <button class="btn btn-primary w-100 mb-2" onclick="calculatemul()">Multiply</button>
                <button class="btn btn-secondary w-100 mb-3" onclick="calculatediv()">Division</button>
                <h3>Results:</h3>
                <p id="multiplication-result" class="alert alert-info"></p>
                <p id="division-result" class="alert alert-info"></p>
            </div>
        </div>
    </div>

    <script>
        function calculatemul() {
            let a = parseFloat(document.getElementById("num1").value);
            let b = parseFloat(document.getElementById("num2").value);
            let c = a * b;
            document.getElementById("multiplication-result").textContent = `Multiplication Result: ${c}`;
        }
        function calculatediv() {
            let a = parseFloat(document.getElementById("num1").value);
            let b = parseFloat(document.getElementById("num2").value);
            if (b === 0) {
                document.getElementById("division-result").textContent = "Cannot divide by zero";
            } else {
                let c = a / b;
                document.getElementById("division-result").textContent = `Division Result: ${c}`;
            }
        }
    </script>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0-alpha3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
