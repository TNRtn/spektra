<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sum, Average, and Grade</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">
    <div class="container mt-5">
        <div class="row justify-content-center">
            <div class="col-md-6">
                <div class="card shadow p-4">
                    <h2 class="text-center mb-4">Sum, Average, and Grade</h2>

                    <div class="mb-3">
                        <label for="marksInput" class="form-label">Enter marks separated by commas:</label>
                        <input type="text" class="form-control" id="marksInput" placeholder="e.g. 85,90,78,88,76">
                    </div>

                    <button class="btn btn-primary w-100 mb-3" onclick="calculateGrades()">Submit</button>

                    <h4>Results:</h4>
                    <p id="sumResult" class="fw-bold text-primary"></p>
                    <p id="averageResult" class="fw-bold text-info"></p>
                    <p id="gradeResult" class="fw-bold text-success"></p>
                </div>
            </div>
        </div>
    </div>

    <script>
        function calculateGrades() {
            let input = document.getElementById("marksInput").value;
            let marks = input.split(',').map(Number);

            let sum = marks.reduce((acc, curr) => acc + curr, 0);
            let average = sum / marks.length;

            let grade;
            if (average >= 91 && average <= 100) {
                grade = 'A Grade';
            } else if (average >= 81 && average <= 90) {
                grade = 'B Grade';
            } else if (average >= 71 && average <= 80) {
                grade = 'C Grade';
            } else {
                grade = 'D Grade';
            }

            document.getElementById("sumResult").textContent = `Sum: ${sum}`;
            document.getElementById("averageResult").textContent = `Average: ${average.toFixed(2)}`;
            document.getElementById("gradeResult").textContent = `Grade: ${grade}`;
        }
    </script>
</body>
</html>
