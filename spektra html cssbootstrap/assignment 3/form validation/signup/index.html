<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Registration</title>
    
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0-alpha1/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        body {
            background: linear-gradient(135deg, #6a11cb, #2575fc);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .container {
            background: rgba(255, 255, 255, 0.9);
            padding: 2rem;
            border-radius: 15px;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.2);
        }

        .error {
            color: #dc3545;
            font-size: 0.9em;
            margin-top: 0.25rem;
        }
    </style>
</head>
<body>
    <div class="container">
        <h2 class="text-center mb-4 text-dark">SIGNUP FORM</h2>
        <form  onsubmit="return validateForm()">
           
            <div class="mb-3">
                <label for="fname" class="form-label text-dark">First Name</label>
                <input type="text" class="form-control" id="fname" name="firstname" placeholder="Enter First Name">
                <span class="error" id="fnameError"></span>
            </div>

            <div class="mb-3">
                <label for="lname" class="form-label text-dark">Last Name</label>
                <input type="text" class="form-control" id="lname" name="lastname" placeholder="Enter Last Name">
                <span class="error" id="lnameError"></span>
            </div>

            
            <div class="mb-3">
                <label for="age" class="form-label text-dark">Age</label>
                <input type="number" class="form-control" id="age" name="age" placeholder="Enter your Age">
                <span class="error" id="ageError"></span>
            </div>

            
            <div class="mb-3">
                <label for="pnumber" class="form-label text-dark">Phone Number</label>
                <input type="tel" class="form-control" id="pnumber" name="pnumber" placeholder="Enter phone number">
                <span class="error" id="pnumberError"></span>
            </div>

            
            <div class="mb-3">
                <label for="email" class="form-label text-dark">Email</label>
                <input type="email" class="form-control" id="email" name="mail" placeholder="Enter email">
                <span class="error" id="emailError"></span>
            </div>

            
            <div class="d-grid gap-2 d-md-flex justify-content-md-end mt-4">
                <button type="button" class="btn btn-danger" onclick="clearForm()">Clear</button>
                <button type="submit" class="btn btn-success">Register</button>
            </div>
        </form>
    </div>


    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0-alpha1/dist/js/bootstrap.bundle.min.js"></script>

    <script>
        function validateForm() {
           
            document.getElementById('fnameError').textContent = '';
            document.getElementById('lnameError').textContent = '';
            document.getElementById('ageError').textContent = '';
            document.getElementById('pnumberError').textContent = '';
            document.getElementById('emailError').textContent = '';

            
            const firstName = document.getElementById('fname').value.trim();
            const lastName = document.getElementById('lname').value.trim();
            const age = document.getElementById('age').value.trim();
            const phoneNumber = document.getElementById('pnumber').value.trim();
            const email = document.getElementById('email').value.trim();

            let isValid = true;

            
            if (!/^[A-Za-z]{1,32}$/.test(firstName)) {
                document.getElementById('fnameError').textContent = 'First name must contain only alphabets (1-32 characters).';
                isValid = false;
            }

            
            if (!/^[A-Za-z]{1,32}$/.test(lastName)) {
                document.getElementById('lnameError').textContent = 'Last name must contain only alphabets (1-32 characters).';
                isValid = false;
            }


            if (isNaN(age) || age < 18 || age > 100) {
                document.getElementById('ageError').textContent = 'Age must be between 18 and 100.';
                isValid = false;
            }

            
            if (!/^\d{10}$/.test(phoneNumber)) {
                document.getElementById('pnumberError').textContent = 'Phone number must be 10 digits.';
                isValid = false;
            }

            
            if (!/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(email)) {
                document.getElementById('emailError').textContent = 'Please enter a valid email address.';
                isValid = false;
            }

            
            return isValid;
        }

       
        function clearForm() {
            document.getElementById('fname').value = '';
            document.getElementById('lname').value = '';
            document.getElementById('age').value = '';
            document.getElementById('pnumber').value = '';
            document.getElementById('email').value = '';

            document.getElementById('fnameError').textContent = '';
            document.getElementById('lnameError').textContent = '';
            document.getElementById('ageError').textContent = '';
            document.getElementById('pnumberError').textContent = '';
            document.getElementById('emailError').textContent = '';
        }
    </script>
</body>
</html>
