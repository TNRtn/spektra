<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pro Calculator</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        .calculator {
            width: 400px;
            margin: 50px auto;
            padding: 20px;
            border-radius: 10px;
            background-color: #222;
            box-shadow: 0 4px 8px rgba(0, 0, 0, 0.2);
        }

        .display {
            background-color: #fff;
            height: 60px;
            text-align: right;
            padding: 10px;
            font-size: 1.5rem;
            margin-bottom: 10px;
            border-radius: 5px;
            overflow: hidden;
            white-space: nowrap;
        }

        .btn {
            width: 70px;
            height: 70px;
            margin: 5px;
            font-size: 1.2rem;
        }

        .btn-orange {
            background-color: orange;
            color: white;
        }

            .btn-orange:hover {
                background-color: red;
            }

        .btn-grey {
            background-color: green;
            color: white;
        }
    </style>
</head>
<body>
    <div class="calculator text-center">
        <div class="display" id="display">0</div>
        <div class="d-flex flex-wrap justify-content-center">
            <button class="btn btn-grey" onclick="clearDisplay()">C</button>
            <button class="btn btn-grey" onclick="setOperator('%')">%</button>
            <button class="btn btn-grey" onclick="backspace()">⌫</button>
            <button class="btn btn-orange" onclick="setOperator('/')">÷</button>
            <button class="btn btn-light" onclick="appendValue('7')">7</button>
            <button class="btn btn-light" onclick="appendValue('8')">8</button>
            <button class="btn btn-light" onclick="appendValue('9')">9</button>
            <button class="btn btn-orange" onclick="setOperator('*')">×</button>
            <button class="btn btn-light" onclick="appendValue('4')">4</button>
            <button class="btn btn-light" onclick="appendValue('5')">5</button>
            <button class="btn btn-light" onclick="appendValue('6')">6</button>
            <button class="btn btn-orange" onclick="setOperator('-')">-</button>
            <button class="btn btn-light" onclick="appendValue('1')">1</button>
            <button class="btn btn-light" onclick="appendValue('2')">2</button>
            <button class="btn btn-light" onclick="appendValue('3')">3</button>
            <button class="btn btn-orange" onclick="setOperator('+')">+</button>
            <button class="btn btn-light" onclick="appendValue('0')">0</button>
            <button class="btn btn-light" onclick="appendValue('.')">.</button>
            <button class="btn btn-light" onclick="appendValue('00')">00</button>
            <button class="btn btn-orange" onclick="calculateResult()">=</button>
        </div>
    </div>

    <script>
        let expression = ""; 
        const display = document.getElementById("display");

        function appendValue(value) {
            expression += value;
            display.innerText = expression;
        }

        function setOperator(op) {
            if (expression.length > 0 && "+-*/%".includes(expression.slice(-1)) === false) {
                expression += " " + op + " ";
                display.innerText = expression;
            }
        }

        function clearDisplay() {
            expression = "";
            display.innerText = "0";
        }

        function backspace() {
            if (expression.length > 0) {
                expression = expression.trim().slice(0, -1);
                display.innerText = expression || "0";
            }
        }

        function calculateResult() {
            let tokens = expression.split(" ");
            let result = parseFloat(tokens[0]);

            let i = 1;
            while (i < tokens.length) {
                let operator = tokens[i];
                let num2 = parseFloat(tokens[i + 1]);

                switch (operator) {
                    case '+':
                        result += num2;
                        break;
                    case '-':
                        result -= num2;
                        break;
                    case '*':
                        result *= num2;
                        break;
                    case '/':
                        result = num2 !== 0 ? result / num2 : 'Error';
                        break;
                    case '%':
                        result = num2 !== 0 ? result % num2 : 'Error';
                        break;
                    default:
                        result = "Error";
                        break;
                }
                i += 2; 
            }

            display.innerText = result;
            expression = result.toString(); 
        }
    </script>
</body>
</html>
